<!-- Role : ecran d'introduction et point d'entree du portfolio. -->
<!-- Parcours : metadonnees et styles, effets du splash, identite et bouton, puis scripts d'animation/langue. -->
<!doctype html>
<html lang="fr">
  <head>
    <!-- Metadonnees de partage, identite du site et styles de l'ecran d'introduction. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>Portfolio – Xavier Martineau</title>
    <meta
      name="description"
      content="Portfolio de Xavier Martineau : projets web, 2D, 3D et expériences interactives."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portfolio – Xavier Martineau" />
    <meta
      property="og:description"
      content="Découvrez les projets web, 2D, 3D et interactifs de Xavier Martineau."
    />
    <meta
      property="og:image"
      content="assets/images/portfolio-social-preview.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/svg/Logo_svg.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/splash.css" />
    <link rel="stylesheet" href="./css/animation.css" />
    <link rel="stylesheet" href="./css/font.css" />
  </head>

  <body>
    <!-- Contenu principal de l'ecran d'accueil. -->
    <!-- Grille de fond -->
    <div class="grid-bg"></div>

    <div id="splash" class="splash">
      <!-- Canvas anime par splash.js : particules, liaisons et halo de souris. -->
      <canvas id="splash-canvas" class="canvas"></canvas>

      <!-- Orbes animés pilotés en JavaScript -->
      <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>

      <!-- Carte centrale : identite, competences, progression et bouton d'entree. -->
      <div class="card">
        <div class="card-top-line"></div>

        <!-- ====== LOGO ====== -->
        <div class="logo">
          <div class="logo-inner">
            <img
              src="assets/svg/Logo_svg.svg"
              alt="Logo de Xavier Martineau"
              width="987"
              height="1006"
              decoding="async"
            />
          </div>
          <div class="logo-glow"></div>
        </div>

        <!-- ====== NOM PRINCIPAL ====== -->
        <h1 class="title">Xavier <span class="gradient">Martineau</span></h1>

        <!-- Precise sous le nom que cette page est le portfolio de Xavier. -->
        <h2 class="subtitle">Portfolio de Xavier Martineau</h2>

        <!-- Séparateur avec le point lumineux -->
        <div class="divider">
          <div></div>
          <div class="dot"></div>
          <div></div>
        </div>

        <!-- Competences resumees affichees sous le titre du portfolio. -->
        <div class="skills">
          <span class="skill skill-games">Jeux vidéo</span>
          <span class="skill skill-web">Développeur HTML/CSS</span>
          <span class="skill skill-design">Design graphique</span>
          <span class="skill skill-code">Gestion de code</span>
        </div>

        <!-- Barre decorative animee pendant l'ecran d'introduction. -->
        <div class="progress">
          <div class="progress-bar"></div>
        </div>

        <!-- Le clic declenche le fondu puis ouvre la page d'accueil du portfolio. -->
        <button id="enter-btn" class="enter-btn">
          <span class="texte-entrer">ENTRER DANS</span>
          <span><strong>MON PORTFOLIO</strong></span>
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M3 8h10M9 4l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div class="card-bottom-line"></div>
      </div>

      <!-- Informations de version et signature affichees aux coins de l'ecran. -->
      <div class="meta meta-left">v1.0.2 // 2026-10-09</div>
      <div class="meta meta-right">PORTFOLIO // XM</div>

      <div class="online">
        <div class="online-dot"></div>
        <span>EN LIGNE</span>
      </div>
    </div>

    <!-- Initialisation du fond anime, navigation et prise en charge de la langue. -->
    <script src="./js/splash.js"></script>
    <script src="./js/traduction.js"></script>
  </body>
</html>
