<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio – Xavier Martineau</title>
    <link rel="stylesheet" href="./css/splash.css" />
    <link rel="stylesheet" href="./css/font.css" />
  </head>

  <body>
    <!-- Grille de fond -->
    <div class="grid-bg"></div>

    <div id="splash" class="splash">
      <!-- Canvas pour les particules et lignes gérées en JS -->
      <canvas id="splash-canvas" class="canvas"></canvas>

      <!-- Orbes animés pilotés en JavaScript -->
      <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>

      <!-- Carte centrale (Glassmorphism) -->
      <div class="card">
        <div class="card-top-line"></div>

        <!-- ====== LOGO ====== -->
        <div class="logo">
          <div class="logo-inner">
            <img src="assets/svg/Logo_svg.svg" alt="Logo XM" />
          </div>
          <div class="logo-glow"></div>
        </div>

        <!-- ====== NOM PRINCIPAL ====== -->
        <h1 class="title">Xavier <span class="gradient">Martineau</span></h1>

        <!-- Sous-titre (CORRIGÉ) -->
        <h2 class="subtitle">Portfolio de Xavier Martineau</h2>

        <!-- Séparateur avec le point lumineux -->
        <div class="divider">
          <div></div>
          <div class="dot"></div>
          <div></div>
        </div>

        <!-- ====== SECTION COMPÉTENCES ====== -->
        <div class="skills">
          <span class="skill" style="color: #6366f1">Jeux vidéo</span>
          <span class="skill" style="color: #ff00ea">Développeur HTML/CSS</span>
          <span class="skill" style="color: #00f3ff">Design graphique</span>
          <span class="skill" style="color: #8b5cf6">Gestion de code</span>
        </div>

        <!-- Progression / chargement -->
        <div class="progress">
          <div class="progress-bar"></div>
        </div>

        <!-- Bouton d'entrée -->
        <button id="enter-btn" class="enter-btn">
          <span class="texte-entrer">ENTRER DANS</span>
          <span><strong>LE PORTFOLIO</strong></span>
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M3 8h10M9 4l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div class="card-bottom-line"></div>
      </div>

      <!-- Meta -->
      <div class="meta meta-left">v1.7.0 // 2026-09-16</div>
      <div class="meta meta-right">PORTFOLIO // XM</div>

      <div class="online">
        <div class="online-dot"></div>
        <span>EN LIGNE</span>
      </div>
    </div>

    <script src="./js/splash.js"></script>
  </body>
</html>
