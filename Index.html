<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio – Xavier Martineau</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="splash" class="splash">
      <canvas id="splash-canvas" class="canvas"></canvas>

      <!-- Orbes -->
      <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <!-- Carte -->
      <div class="card">
        <div class="card-top-line"></div>

        <div class="logo">
          <div class="logo-inner">XM</div>
          <div class="logo-glow"></div>
        </div>

        <h1 class="title">Xavier <span class="gradient">Martineau</span></h1>

        <p class="subtitle">DÉVELOPPEUR WEB</p>

        <div class="divider">
          <div></div>
          <div class="dot"></div>
          <div></div>
        </div>

        <div class="skills-main">
          <span class="skill-1" style="color: #6366f1">Jeux vidéo</span>
          <span class="skill-2" style="color: #ff00ea"
            >Developpeur HTML/CSS</span
          >
          <span class="skill-3" style="color: #00f3ff">Design graphique</span>
          <span class="skill-4" style="color: #8b5cf6">Gestion de code</span>
        </div>

        <div class="progress">
          <div class="progress-bar"></div>
        </div>

        <button id="enter-btn" class="enter-btn">
          <span>Entrer dans le portfolio</span>
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M3 8h10M9 4l4 4-4 4"
              stroke="#6366f1"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div class="card-bottom-line"></div>
      </div>

      <div class="meta meta-left">v14.0.0 // 03-09-2026</div>
      <div class="meta meta-right">PORTFOLIO // XM</div>

      <div class="online">
        <div class="online-dot"></div>
        <span>EN LIGNE </span>
      </div>
    </div>

    <script src="splash.js"></script>
  </body>
</html>
